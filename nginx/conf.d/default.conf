# ==============================================================================
# Nginx Reverse Proxy Configuration (Optimized for Cloudflare Edge & Docker)
# SSL/TLS termination is handled at Cloudflare Edge; Nginx routes internal traffic.
# ==============================================================================

upstream backend_api {
    server backend:3001;
    keepalive 32;
}

upstream frontend_app {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Maximum payload size (accommodates SCORM package uploads and media files)
    client_max_body_size 50M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME-challenge (if local Certbot verification is ever needed)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # 1. API Routing -> NestJS Backend
    # Trailing slash on proxy_pass strips the /api/ prefix before forwarding,
    # since backend controllers are mounted bare (e.g. AuthController @Controller('auth')),
    # not under /api. NEXT_PUBLIC_API_URL must then end in /api for this to line up.
    location /api/ {
        proxy_pass http://backend_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 2. WebSocket Routing -> Socket.IO Gateway (/socket.io/)
    location /socket.io/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Persistent connection timeouts for WebSocket collaboration
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # 3. Static Media and SCORM uploads -> NestJS Static Files
    location /uploads/ {
        proxy_pass http://backend_api/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 4. Universal Web Application Routing -> Next.js 16 Frontend
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js Server-Sent Events / HMR support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
